apiVersion: batch/v1
kind: Job
metadata:
  name: career-migrate
  namespace: career-ai
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: career-migrate
        app.kubernetes.io/part-of: global-career-ai
    spec:
      restartPolicy: Never
      serviceAccountName: career-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: career-api:phase14
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: career-config
            - secretRef:
                name: career-runtime
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
