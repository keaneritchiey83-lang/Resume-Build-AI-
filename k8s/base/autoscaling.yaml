apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: career-api
  namespace: career-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: career-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: career-web
  namespace: career-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: career-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: career-worker
  namespace: career-ai
spec:
  scaleTargetRef:
    name: career-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 30
  fallback:
    failureThreshold: 3
    replicas: 4
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_ADDRESS
        passwordFromEnv: REDIS_PASSWORD
        listName: celery
        listLength: "5"
        activationListLength: "1"
        enableTLS: "true"
