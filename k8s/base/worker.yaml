apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-worker
  namespace: career-ai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: career-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: career-worker
        app.kubernetes.io/part-of: global-career-ai
    spec:
      serviceAccountName: career-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: career-worker
      containers:
        - name: worker
          image: career-api:phase14
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - "app.celery_app.celery"
            - "worker"
            - "--loglevel=INFO"
            - "--concurrency=2"
          envFrom:
            - configMapRef:
                name: career-config
            - secretRef:
                name: career-runtime
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spire-sockets
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
