apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: career-ai
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        timeout: 5s
        send_batch_size: 1024
      resource:
        attributes:
          - key: service.namespace
            value: global-career-ai
            action: upsert
    exporters:
      otlphttp/siem:
        endpoint: ${env:SIEM_OTLP_ENDPOINT}
        headers:
          Authorization: ${env:SIEM_OTLP_AUTHORIZATION}
      debug:
        verbosity: basic
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/siem]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/siem]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: career-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: SIEM_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: career-runtime
                  key: SIEM_OTLP_ENDPOINT
            - name: SIEM_OTLP_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: career-runtime
                  key: SIEM_OTLP_AUTHORIZATION
                  optional: true
          ports:
            - name: grpc
              containerPort: 4317
            - name: http
              containerPort: 4318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: career-ai
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
    - name: http
      port: 4318
      targetPort: http
