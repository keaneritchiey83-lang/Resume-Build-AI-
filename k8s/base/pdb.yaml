apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: career-api
  namespace: career-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: career-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: career-worker
  namespace: career-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: career-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: career-web
  namespace: career-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: career-web
