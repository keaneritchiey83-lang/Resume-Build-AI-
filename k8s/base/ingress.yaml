apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: career-ai
  namespace: career-ai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - career.example.com
      secretName: career-tls
  rules:
    - host: career.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: career-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: career-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: career-web
                port:
                  number: 80
