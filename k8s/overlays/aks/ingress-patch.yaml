apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: career-ai
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: REPLACE_ME.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: career-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: career-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: career-web
                port:
                  number: 80
  tls:
    - hosts: ["REPLACE_ME.example.com"]
      secretName: career-tls
