name: Phase 13 Signed Release Transparency

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Immutable OCI image reference including @sha256:digest"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read
  attestations: write

jobs:
  sign-and-log:
    runs-on: ubuntu-latest
    # Must be configured with independent required reviewers in repository settings.
    # Never let a caller select an arbitrary unprotected environment.
    environment: production-signing
    steps:
      - uses: actions/checkout@v4

      - name: Require immutable digest
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^[a-zA-Z0-9._:/-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "image_ref must include a complete SHA-256 digest" >&2
            exit 1
          fi

      - name: Require security approval reference bound to checked-out source
        shell: bash
        env:
          APPROVED_SHA: ${{ vars.GCAI_RELEASE_APPROVED_SHA }}
          SECURITY_APPROVAL_ID: ${{ vars.GCAI_SECURITY_APPROVAL_ID }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ && "$APPROVED_SHA" == "$GITHUB_SHA" ]] || { echo "Approved source SHA missing or mismatched" >&2; exit 1; }
          [[ -n "$SECURITY_APPROVAL_ID" ]] || { echo "Independent security approval reference required" >&2; exit 1; }
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image and publish transparency entry
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"

      - name: Verify keyless signature
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/phase13-release-transparency.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Release notes
        run: |
          echo "Cosign keyless signing publishes verification material to the Sigstore transparency infrastructure."
          echo "The application-level model release manifest is independently signed and recorded in the Phase 13 transparency chain."
