name: Phase 13 Signed Release Transparency

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Immutable OCI image reference including @sha256:digest"
        required: true
        type: string
      environment:
        description: "GitHub environment requiring release approval"
        required: true
        default: production
        type: string

permissions:
  contents: read
  id-token: write
  packages: read
  attestations: write

jobs:
  sign-and-log:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Require immutable digest
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          case "$IMAGE_REF" in
            *@sha256:*) ;;
            *)
              echo "image_ref must be immutable and include @sha256:digest" >&2
              exit 1
              ;;
          esac

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image and publish transparency entry
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"

      - name: Verify keyless signature
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/phase13-release-transparency.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Release notes
        run: |
          echo "Cosign keyless signing publishes verification material to the Sigstore transparency infrastructure."
          echo "The application-level model release manifest is independently signed and recorded in the Phase 13 transparency chain."
