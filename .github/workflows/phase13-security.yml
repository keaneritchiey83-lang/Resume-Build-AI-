name: Phase 13 Trust Continuity and AI Security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  governance-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: career_test
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career -d career_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://career:career@localhost:5432/career_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-which-is-long-enough-1234567890
      LOCAL_MASTER_KEYS_JSON: '{"local-v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      LOCAL_CURRENT_KEY_ID: local-v1
      KEY_PROVIDER: local
      PHASE13_MODEL_GATEWAY_ALLOWED_MODELS: gpt-5.6
      PHASE13_AGENT_MANIFEST_REQUIRED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall backend/app backend/tests backend/alembic backend/scripts
      - name: Tests
        run: |
          cd backend
          pytest -q
      - name: Phase 13 governance gate
        run: python backend/scripts/run_phase13_governance_gate.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse YAML
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path("k8s").rglob("*.yaml")) + list(Path(".github/workflows").glob("*.yml"))
          for path in files:
              list(yaml.safe_load_all(path.read_text()))
          print(f"Parsed {len(files)} YAML files")
          PY
      - name: Enforce Phase 13 image defaults
        run: |
          # Verify versioned image overrides rather than a literal phase name.
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path("k8s/base/kustomization.yaml").read_text())
          images = cfg.get("images", [])
          expected = {"career-api", "career-web"}
          actual = {image.get("name") for image in images}
          assert actual == expected, f"Unexpected image set: {actual}"
          for image in images:
              repo = image.get("newName", "")
              tag = image.get("newTag", "")
              assert repo.startswith("ghcr.io/"), f"Non-GHCR image: {repo}"
              assert tag and tag.lower() not in {"latest", "main", "stable"}, f"Floating image tag: {tag}"
          print("Validated explicit GHCR image names and versioned tags")
          PY
          if grep -R --line-number -E 'privileged:[[:space:]]*true|allowPrivilegeEscalation:[[:space:]]*true' k8s; then
            echo "Privileged Kubernetes configuration is prohibited." >&2
            exit 1
          fi

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, verified release commit
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
