name: release-cloud-images

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud registry
        required: true
        type: choice
        options:
          - aws
          - azure
      tag:
        description: Immutable release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  aws:
    if: inputs.cloud == 'aws'
    runs-on: ubuntu-latest
    environment: production-eks
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            image_var: AWS_ECR_API_IMAGE
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile.prod
            image_var: AWS_ECR_WEB_IMAGE
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image
        id: image
        shell: bash
        run: |
          if [ "${{ matrix.image_var }}" = "AWS_ECR_API_IMAGE" ]; then
            echo "uri=${{ vars.AWS_ECR_API_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=${{ vars.AWS_ECR_WEB_IMAGE }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}:${{ inputs.tag }}
            ${{ steps.image.outputs.uri }}:${{ github.sha }}
          provenance: true
          sbom: true

  azure:
    if: inputs.cloud == 'azure'
    runs-on: ubuntu-latest
    environment: production-aks
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to ACR
        shell: bash
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.AZURE_ACR_NAME }}.azurecr.io/global-career-${{ matrix.name }}:${{ inputs.tag }}
            ${{ vars.AZURE_ACR_NAME }}.azurecr.io/global-career-${{ matrix.name }}:${{ github.sha }}
          provenance: true
          sbom: true
