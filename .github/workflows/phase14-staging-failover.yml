# WARNING: disruptive, gated staging-only drill requiring manual or trusted schedule approvals.
name: Phase14 staging region failover exercise
on:
  workflow_dispatch:
    inputs:
      confirm_staging_impact:
        description: "Type FAILOVER STAGING to acknowledge a controlled staging outage"
        type: string
        required: true
concurrency:
  group: phase14-staging-failover
  cancel-in-progress: false
jobs:
  drill:
    environment: staging
    if: ${{ inputs.confirm_staging_impact == 'FAILOVER STAGING' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Configure staging kubeconfig
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG_B64 }}
        run: |
          test -n "$STAGING_KUBECONFIG_B64"
          mkdir -p ~/.kube
          printf '%s' "$STAGING_KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Run controlled failover and restore original selector
        env:
          GLOBAL_URL: ${{ vars.STAGING_GLOBAL_URL }}
          FAILED_URL: ${{ vars.STAGING_FAILED_REGION_URL }}
          SURVIVOR_URL: ${{ vars.STAGING_SURVIVOR_URL }}
          SURVIVOR_REGION: ${{ vars.STAGING_SURVIVOR_REGION }}
          CONTEXT: ${{ vars.STAGING_FAILOVER_CONTEXT }}
        run: |
          python ops/phase14/failover/failover_drill.py \
            --kube-context "$CONTEXT" \
            --namespace career-ai-staging \
            --service career-api \
            --global-url "$GLOBAL_URL" \
            --failed-region-url "$FAILED_URL" \
            --survivor-url "$SURVIVOR_URL" \
            --survivor-region "$SURVIVOR_REGION" \
            --execute --ack-impact
