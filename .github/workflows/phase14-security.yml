name: Phase14 agents and operational governance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  phase14:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install complete backend
        run: pip install -e ".[dev]"
      - name: Phase14 compilation and isolation/approval tests
        run: |
          python -m compileall -q app phase14 alembic scripts tests
          pytest -q tests/test_phase14.py tests/test_phase14_integration_contract.py
          python scripts/run_phase14_governance_gate.py
      - name: Cost and N-1 capacity gate
        run: python ../ops/phase14/capacity/capacity_gate.py ../ops/phase14/capacity/example-budget.json
