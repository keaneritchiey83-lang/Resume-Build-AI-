name: Phase 11 Supply Chain

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write

jobs:
  backend-sbom-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t career-api:${GITHUB_SHA} backend

      - name: Export image
        run: docker save career-api:${GITHUB_SHA} -o career-api.tar

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: career-api:${{ github.sha }}
          format: spdx-json
          output-file: career-api.spdx.json

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: career-api.tar

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: career-api.tar
          sbom-path: career-api.spdx.json

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: career-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
