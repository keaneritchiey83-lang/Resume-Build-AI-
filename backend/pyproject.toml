[project]
name = "global-career-architecture-ai"
version = "0.17.0"
description = "Enterprise-protected global career architecture, resume, interview and authorized recruiting integration API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
    "redis>=5,<7",
    "sentence-transformers>=3,<6",
    "apscheduler>=3.10,<4",
    "pyjwt[crypto]>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "cryptography>=43,<47",
    "python-multipart>=0.0.12,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openai>=1.75,<3",
    "alembic>=1.14,<2",
    "authlib>=1.4,<2",
    "itsdangerous>=2.2,<3",
    "pyotp>=2.9,<3",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "azure-identity>=1.17,<2",
    "azure-keyvault-keys>=4.9,<5",
    "openai-agents>=0.2,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-celery>=0.48b0,<1",
    "webauthn>=2.5,<3",
    "cbor2>=5.6,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "phase14*"]
exclude = ["tests*", "alembic*", "scripts*"]
