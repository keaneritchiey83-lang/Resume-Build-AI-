services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: career
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - career_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - career_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    env_file:
      - .env
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    env_file:
      - .env
    command:
      - celery
      - -A
      - app.celery_app.celery
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    env_file:
      - .env
    command:
      - celery
      - -A
      - app.celery_app.celery
      - beat
      - --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy


  runtime-sensor-gateway:
    build: ./runtime-sensor-gateway
    profiles: ["runtime-security"]
    environment:
      CAREER_RUNTIME_ENDPOINT: http://api:8000/v1/phase12/runtime/events
      RUNTIME_SENSOR_TOKEN: ${PHASE12_RUNTIME_SENSOR_TOKEN:-}
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  career_postgres:
  career_redis:
